# Render blueprint for the backend. Secrets are entered in the Render dashboard, never here.
services:
  - type: web
    name: careerpilot-api
    runtime: docker
    # Free instances sleep after about 15 minutes idle and take up to a minute to wake, so
    # the first visitor after a quiet spell waits. No card, which is the point.
    plan: free
    # Closest free region to the Supabase project in ap-south-1; delete this line to take
    # Render's default (Oregon), which adds a few hundred milliseconds to every query.
    region: singapore
    rootDir: backend
    # /health answers 200 whenever the process is alive and reports the database in its
    # body, so Render never restarts the service over an outage it cannot fix.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: google
      # Default to fast, cost-efficient Gemini models with automatic quota failover
      - key: GOOGLE_MODEL
        value: gemini-3.8-flash,gemini-2.5-flash
      # Entered in the dashboard: Gemini API key from Google AI Studio (supports multiple comma-separated keys)
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional: Supabase *session pooler* string (defaults to SQLite if blank)
      - key: DATABASE_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      # Pre-configured to allow the live Vercel frontend and local development
      - key: FRONTEND_ORIGIN
        value: https://career-pilot-lac.vercel.app,http://localhost:3000
      # One proxy in front of the app, so the rate limit reads the address Render appends.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
