[project]
name = "careerpilot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.1.3",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "anthropic>=1.11.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
    "langgraph>=1.2.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Header"]
