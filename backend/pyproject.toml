[project]
name = "careerpilot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "app"]

[tool.ruff]
line-length = 100
